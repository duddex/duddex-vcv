<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="121.92mm" height="128.5mm" viewBox="0 0 121.92 128.5">
  <!-- 24HP module panel -->
  <rect width="121.92" height="128.5" fill="#1a1a2e"/>
  <rect x="0.5" y="0.5" width="120.92" height="127.5" fill="none" stroke="#0f3460" stroke-width="0.5"/>

  <!-- Title -->
  <text x="60.96" y="10" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle" fill="#e94560">606 DRUMS</text>
  <text x="60.96" y="16.5" font-family="sans-serif" font-size="4" text-anchor="middle" fill="#8a8aa0">duddex &#183; synth drum voices</text>

  <!-- Column headers -->
  <g font-family="sans-serif" font-size="3.6" text-anchor="middle" fill="#8a8aa0">
    <text x="20" y="30.5">TRIG</text>
    <text x="35" y="30.5">TUNE</text>
    <text x="45" y="30.5">CV</text>
    <text x="58" y="30.5">DECAY</text>
    <text x="68" y="30.5">CV</text>
    <text x="81" y="30.5">CHAR</text>
    <text x="91" y="30.5">CV</text>
